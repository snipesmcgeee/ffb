<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dynasty Command Center</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --bg:#0B1210;
    --surface:#121C18;
    --surface-raised:#182620;
    --line:#25352E;
    --chalk:#EDEFEA;
    --muted:#7E9089;
    --gold:#C9A227;
    --gold-dim:#8A7220;
    --alert:#C0483A;
    --good:#4C8B5E;
    --blue:#3E7A9C;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--chalk);
    font-family:'Segoe UI',Arial,Helvetica,sans-serif;
    padding:0;
  }
  .version-tag{
    position:fixed;
    top:8px;
    left:8px;
    z-index:50;
    font-family:'Consolas','SFMono-Regular',ui-monospace,monospace;
    font-size:10px;
    color:var(--muted);
    background:var(--surface);
    border:1px solid var(--line);
    padding:2px 7px;
    border-radius:3px;
    letter-spacing:0.5px;
  }
  .scorebug{
    background:var(--surface-raised);
    border-bottom:3px solid var(--gold);
    padding:14px 20px 14px 70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
  }
  .scorebug .league-name{
    font-weight:800;
    font-stretch:condensed;
    letter-spacing:0.5px;
    font-size:20px;
    text-transform:uppercase;
  }
  .scorebug .meta{
    font-family:'Consolas','SFMono-Regular',ui-monospace,monospace;
    font-size:12px;
    color:var(--muted);
    letter-spacing:0.5px;
  }
  .team-strip{
    display:flex;
    gap:16px;
    align-items:baseline;
    font-family:'Consolas','SFMono-Regular',ui-monospace,monospace;
  }
  .team-strip .name{font-size:15px;font-weight:700;color:var(--gold);}
  .team-strip .record{font-size:15px;color:var(--chalk);}
  .controls{
    padding:12px 20px;
    display:flex;
    gap:10px;
    align-items:center;
    flex-wrap:wrap;
    border-bottom:1px solid var(--line);
  }
  input[type=text]{
    background:var(--surface);
    border:1px solid var(--line);
    color:var(--chalk);
    padding:8px 10px;
    border-radius:3px;
    font-family:'Consolas','SFMono-Regular',ui-monospace,monospace;
    font-size:13px;
  }
  button{
    background:var(--gold);
    color:#161200;
    border:none;
    padding:8px 16px;
    border-radius:3px;
    font-weight:700;
    letter-spacing:0.5px;
    text-transform:uppercase;
    font-size:12px;
    cursor:pointer;
  }
  button:hover{background:#E0B735;}
  button:disabled{background:var(--gold-dim);cursor:default;}
  .status{
    font-family:'Consolas','SFMono-Regular',ui-monospace,monospace;
    font-size:12px;
    color:var(--muted);
  }
  .tabs{
    display:flex;
    border-bottom:1px solid var(--line);
    padding:0 20px;
  }
  .tab{
    padding:12px 18px;
    font-size:13px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.5px;
    color:var(--muted);
    cursor:pointer;
    border-bottom:3px solid transparent;
  }
  .tab.active{color:var(--chalk);border-bottom-color:var(--gold);}
  .panel{display:none;padding:20px;}
  .panel.active{display:block;}
  .section-label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1.5px;
    color:var(--gold);
    font-weight:700;
    margin:22px 0 10px 0;
  }
  .section-label:first-child{margin-top:0;}
  .value-filters{
    display:flex;
    gap:6px;
    margin-bottom:18px;
    flex-wrap:wrap;
  }
  .value-filter{
    background:var(--surface);
    border:1px solid var(--line);
    color:var(--muted);
    padding:6px 14px;
    border-radius:20px;
    font-size:11px;
    font-weight:700;
    letter-spacing:0.5px;
    text-transform:uppercase;
    cursor:pointer;
  }
  .value-filter.active{background:var(--gold);color:#161200;border-color:var(--gold);}
  .roster-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
    gap:10px;
  }
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-left:3px solid var(--gold);
    border-radius:3px;
    padding:10px 12px;
  }
  .card.bench{border-left-color:var(--muted);}
  .card .pos{
    font-family:'Consolas','SFMono-Regular',ui-monospace,monospace;
    font-size:10px;
    color:var(--gold);
    letter-spacing:1px;
  }
  .card .starter-tag{
    display:inline-block;
    margin-left:6px;
    font-size:9px;
    color:var(--bg);
    background:var(--good);
    padding:1px 5px;
    border-radius:2px;
    letter-spacing:0.5px;
    font-weight:700;
    vertical-align:middle;
  }
  .card .pname{
    font-size:14px;
    font-weight:700;
    margin:2px 0;
  }
  .card .sub{
    font-size:11px;
    color:var(--muted);
  }
  .card .injury{
    display:inline-block;
    margin-top:4px;
    font-size:10px;
    background:var(--alert);
    color:var(--chalk);
    padding:2px 6px;
    border-radius:2px;
    letter-spacing:0.5px;
    text-transform:uppercase;
  }
  .card .valline{
    margin-top:6px;
    font-family:'Consolas','SFMono-Regular',ui-monospace,monospace;
    font-size:11px;
    color:var(--good);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .card .valline.na{color:var(--muted);}
  .card .split-flag{
    color:var(--alert);
    font-weight:700;
  }
  table{
    width:100%;
    border-collapse:collapse;
    font-family:'Consolas','SFMono-Regular',ui-monospace,monospace;
    font-size:13px;
  }
  th,td{
    text-align:left;
    padding:8px 10px;
    border-bottom:1px solid var(--line);
  }
  th{
    color:var(--muted);
    text-transform:uppercase;
    font-size:11px;
    letter-spacing:1px;
    font-weight:600;
  }
  tr.me{background:rgba(201,162,39,0.08);}
  tr.me td:first-child{color:var(--gold);font-weight:700;}
  .empty{
    color:var(--muted);
    font-size:13px;
    padding:30px 0;
    text-align:center;
  }
  .error-box{
    background:rgba(192,72,58,0.12);
    border:1px solid var(--alert);
    color:#E8998E;
    padding:12px 14px;
    border-radius:3px;
    font-size:13px;
    margin:0 20px 16px 20px;
    font-family:'Consolas','SFMono-Regular',ui-monospace,monospace;
  }
  .fa-list{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .fa-row{
    display:grid;
    grid-template-columns:50px 1fr 90px 90px 80px;
    align-items:center;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:3px;
    padding:8px 12px;
    font-size:13px;
    gap:6px;
  }
  .fa-row .pos-badge{
    font-family:'Consolas','SFMono-Regular',ui-monospace,monospace;
    font-size:11px;
    color:var(--gold);
  }
  .fa-row .val-val{
    font-family:'Consolas','SFMono-Regular',ui-monospace,monospace;
    color:var(--good);
    text-align:right;
    font-size:12px;
  }
  .fa-row .val-val.na{color:var(--muted);}
  .fa-head{
    display:grid;
    grid-template-columns:50px 1fr 90px 90px 80px;
    padding:0 12px 6px 12px;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:1px;
    color:var(--muted);
  }
</style>
</head>
<body>

<div class="version-tag">v0.1</div>

<div class="scorebug">
  <div>
    <div class="league-name" id="leagueName">Dynasty Command Center</div>
    <div class="meta" id="leagueMeta">not loaded yet</div>
  </div>
  <div class="team-strip" id="teamStrip"></div>
</div>

<div class="controls">
  <input type="text" id="usernameInput" value="jaheruth2412" placeholder="Sleeper username">
  <input type="text" id="leagueIdInput" value="1328961362654691328" placeholder="League ID" style="width:220px;">
  <button id="fetchBtn">Pull latest</button>
  <span class="status" id="statusLine">enter your info and hit pull latest</span>
</div>

<div id="errorBox"></div>

<div class="tabs">
  <div class="tab active" data-tab="roster">My Roster</div>
  <div class="tab" data-tab="standings">League Standings</div>
  <div class="tab" data-tab="freeagents">Free Agents</div>
</div>

<div class="panel active" id="panel-roster">
  <div id="rosterContent"><div class="empty">No data yet — pull latest to load your roster.</div></div>
</div>

<div class="panel" id="panel-standings">
  <div id="standingsContent"><div class="empty">No data yet — pull latest to load standings.</div></div>
</div>

<div class="panel" id="panel-freeagents">
  <div id="freeAgentsContent"><div class="empty">No data yet — pull latest to load free agents.</div></div>
</div>

<script>
const API = 'https://api.sleeper.app/v1';
const DP_VALUES_URL = 'https://raw.githubusercontent.com/DynastyProcess/data/master/files/values-players.csv';
const FC_VALUES_URL = 'https://api.fantasycalc.com/values/current?isDynasty=true&numQbs=1&numTeams=10&ppr=0.5';

let players = null;       // full Sleeper player dict, fetched once per session
let activeFilter = 'dynasty'; // 'dynasty' | 'season' | 'weekly'

// Cache of last successful pull, so switching filters doesn't require a refetch
let lastData = null; // { myRoster, league, rosters, usersById, playerMap, projMap, isHalfPpr, projLabel, valuesMap, currentWeek }

document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    document.getElementById('panel-'+t.dataset.tab).classList.add('active');
  });
});

function setStatus(msg){ document.getElementById('statusLine').textContent = msg; }
function showError(msg){
  document.getElementById('errorBox').innerHTML = msg
    ? `<div class="error-box">${msg}</div>` : '';
}

async function getJSON(url){
  const res = await fetch(url);
  if(!res.ok) throw new Error(`${url} returned ${res.status}`);
  return res.json();
}

async function loadPlayersOnce(){
  if(players) return players;
  setStatus('downloading player database (first time only, ~large file)...');
  players = await getJSON(`${API}/players/nfl`);
  return players;
}

// Sleeper's projections endpoint isn't in their official public docs anymore —
// it's a community-known endpoint that may change or disappear. Fail soft.
async function fetchProjectionsSafe(season, week){
  const urls = [
    `${API}/projections/nfl/regular/${season}/${week}`,
    `https://api.sleeper.com/projections/nfl/${season}/${week}?season_type=regular`
  ];
  for(const url of urls){
    try{
      const data = await getJSON(url);
      if(data && typeof data === 'object') return data;
    }catch(e){ /* try next */ }
  }
  return null;
}

function projPoints(projEntry, isHalfPpr){
  if(!projEntry) return null;
  const stats = projEntry.stats || projEntry;
  if(isHalfPpr && stats.pts_half_ppr != null) return stats.pts_half_ppr;
  if(stats.pts_ppr != null) return stats.pts_ppr;
  if(stats.pts_std != null) return stats.pts_std;
  return null;
}

// Name normalization for matching DynastyProcess rows (keyed by name) to Sleeper players
function normName(name){
  if(!name) return '';
  return name.toLowerCase()
    .replace(/[.']/g, '')
    .replace(/\b(jr|sr|ii|iii|iv|v)\b/g, '')
    .replace(/[^a-z ]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}

// FantasyCalc: public API, includes sleeperId directly — reliable join, no name matching needed.
async function fetchFantasyCalcSafe(numQbs){
  try{
    const url = `https://api.fantasycalc.com/values/current?isDynasty=true&numQbs=${numQbs}&numTeams=10&ppr=0.5`;
    const data = await getJSON(url);
    const map = {};
    (data || []).forEach(row => {
      const sid = row.player && row.player.sleeperId;
      if(sid) map[sid] = { dynasty: row.value, redraft: row.redraftValue };
    });
    return map;
  }catch(e){
    console.error('FantasyCalc fetch failed', e);
    return null;
  }
}

// DynastyProcess: open-data CSV, keyed by player name — approximate match, fails soft per player.
async function fetchDynastyProcessSafe(numQbs){
  try{
    const res = await fetch(DP_VALUES_URL);
    if(!res.ok) throw new Error(`DP values returned ${res.status}`);
    const text = await res.text();
    const parsed = Papa.parse(text, { header: true, dynamicTyping: true, skipEmptyLines: true });
    const valueField = numQbs >= 2 ? 'value_2qb' : 'value_1qb';
    const map = {}; // normalized name -> dynasty value
    parsed.data.forEach(row => {
      if(!row.player) return;
      const val = row[valueField];
      if(val == null) return;
      map[normName(row.player)] = val;
    });
    return map;
  }catch(e){
    console.error('DynastyProcess fetch failed', e);
    return null;
  }
}

function buildValuesMap(playerMap, fcMap, dpNameMap){
  // sleeper_id -> { fcDynasty, fcRedraft, dpDynasty }
  const out = {};
  Object.keys(playerMap).forEach(id => {
    const p = playerMap[id];
    if(!p || !p.position) return;
    const entry = {};
    if(fcMap && fcMap[id]){
      entry.fcDynasty = fcMap[id].dynasty;
      entry.fcRedraft = fcMap[id].redraft;
    }
    if(dpNameMap){
      const name = p.first_name && p.last_name ? `${p.first_name} ${p.last_name}` : p.full_name;
      const dpVal = dpNameMap[normName(name)];
      if(dpVal != null) entry.dpDynasty = dpVal;
    }
    if(Object.keys(entry).length) out[id] = entry;
  });
  return out;
}

function dynastyBlend(entry){
  if(!entry) return null;
  const vals = [];
  if(entry.fcDynasty != null) vals.push(entry.fcDynasty);
  if(entry.dpDynasty != null) vals.push(entry.dpDynasty);
  if(!vals.length) return null;
  const avg = vals.reduce((a,b)=>a+b,0) / vals.length;
  let split = false;
  if(vals.length === 2){
    split = Math.abs(vals[0]-vals[1]) / avg > 0.20;
  }
  return { avg, split, fc: entry.fcDynasty, dp: entry.dpDynasty };
}

function valueFor(id, filter, valuesMap, projMap, isHalfPpr){
  const entry = valuesMap ? valuesMap[id] : null;
  if(filter === 'dynasty'){
    const b = dynastyBlend(entry);
    return b ? b.avg : null;
  }
  if(filter === 'season'){
    return entry && entry.fcRedraft != null ? entry.fcRedraft : null;
  }
  // weekly
  return projMap ? projPoints(projMap[id], isHalfPpr) : null;
}

function valueLineHtml(id, valuesMap, projMap, isHalfPpr, projLabel){
  const entry = valuesMap ? valuesMap[id] : null;
  const b = dynastyBlend(entry);
  const pts = projMap ? projPoints(projMap[id], isHalfPpr) : null;

  const dynastyStr = b
    ? `Dyn: ${Math.round(b.avg)}${b.split ? ' <span class="split-flag">⚠ split</span>' : ''}`
    : `Dyn: —`;
  const seasonStr = (entry && entry.fcRedraft != null) ? `Ssn: ${Math.round(entry.fcRedraft)}` : `Ssn: —`;
  const weeklyStr = (pts != null) ? `${projLabel}: ${pts.toFixed(1)}` : `${projLabel}: —`;

  const naClass = (!b && !(entry && entry.fcRedraft != null) && pts == null) ? ' na' : '';
  return `<div class="valline${naClass}">${dynastyStr} · ${seasonStr} · ${weeklyStr}</div>`;
}

function posSort(a,b){
  const order = {QB:0,RB:1,WR:2,TE:3,K:4,DEF:5};
  return (order[a]??9) - (order[b]??9);
}

function renderRoster(roster, playerMap, valuesMap, projMap, isHalfPpr, projLabel, filter){
  const starterSet = new Set(roster.starters || []);
  const allIds = roster.players || [];

  const groups = {};
  allIds.forEach(id => {
    const p = playerMap[id];
    const pos = (p && p.position) || 'OTHER';
    if(!groups[pos]) groups[pos] = [];
    groups[pos].push(id);
  });

  const sortedPositions = Object.keys(groups).sort(posSort);

  function cardFor(id){
    const p = playerMap[id];
    const isStarter = starterSet.has(id);
    const cls = isStarter ? '' : 'bench';
    if(!p) return `<div class="card ${cls}"><div class="pname">${id}</div><div class="sub">unknown player id</div></div>`;
    const name = p.first_name && p.last_name ? `${p.first_name} ${p.last_name}` : (p.full_name || id);
    const team = p.team || 'FA';
    const injury = p.injury_status ? `<div class="injury">${p.injury_status}</div>` : '';
    const starterTag = isStarter ? `<span class="starter-tag">STARTER</span>` : '';
    return `<div class="card ${cls}">
      <div class="pos">${p.position || '-'} · ${team}${starterTag}</div>
      <div class="pname">${name}</div>
      ${injury}
      ${valueLineHtml(id, valuesMap, projMap, isHalfPpr, projLabel)}
    </div>`;
  }

  const sections = sortedPositions.map(pos => {
    const ids = groups[pos].slice().sort((a,b) => {
      const va = valueFor(a, filter, valuesMap, projMap, isHalfPpr);
      const vb = valueFor(b, filter, valuesMap, projMap, isHalfPpr);
      if(va != null && vb != null) return vb - va;
      if(va != null) return -1;
      if(vb != null) return 1;
      return 0;
    });
    const label = pos === 'DEF' ? 'DEFENSE' : (pos === 'OTHER' ? 'OTHER' : pos + 'S');
    return `<div class="section-label">${label}</div>
      <div class="roster-grid">${ids.map(cardFor).join('')}</div>`;
  }).join('');

  return sections || '<div class="empty">No players on this roster</div>';
}

function renderFreeAgents(playerMap, rosteredIds, valuesMap, projMap, isHalfPpr, projLabel, filter){
  const positions = ['QB','RB','WR','TE','K','DEF'];
  const rows = Object.values(playerMap)
    .filter(p => p && p.position && positions.includes(p.position))
    .filter(p => p.status === 'Active' || p.position === 'DEF')
    .filter(p => !rosteredIds.has(p.player_id))
    .map(p => ({ p, val: valueFor(p.player_id, filter, valuesMap, projMap, isHalfPpr) }))
    .sort((a,b) => {
      if(a.val != null && b.val != null) return b.val - a.val;
      if(a.val != null) return -1;
      if(b.val != null) return 1;
      return (a.p.search_rank||9999) - (b.p.search_rank||9999);
    })
    .slice(0, 60);

  const head = `<div class="fa-head"><span></span><span>Player</span><span style="text-align:right;">Dynasty</span><span style="text-align:right;">Season</span><span style="text-align:right;">${projLabel}</span></div>`;

  const rowsHtml = rows.map(({p}) => {
    const id = p.player_id;
    const name = p.first_name && p.last_name ? `${p.first_name} ${p.last_name}` : p.full_name;
    const entry = valuesMap ? valuesMap[id] : null;
    const b = dynastyBlend(entry);
    const pts = projMap ? projPoints(projMap[id], isHalfPpr) : null;

    const dynHtml = b
      ? `<span class="val-val">${Math.round(b.avg)}${b.split ? ' <span class="split-flag">⚠</span>' : ''}</span>`
      : `<span class="val-val na">—</span>`;
    const ssnHtml = (entry && entry.fcRedraft != null)
      ? `<span class="val-val">${Math.round(entry.fcRedraft)}</span>`
      : `<span class="val-val na">—</span>`;
    const wkHtml = (pts != null)
      ? `<span class="val-val">${pts.toFixed(1)}</span>`
      : `<span class="val-val na">—</span>`;

    return `<div class="fa-row">
      <span class="pos-badge">${p.position}</span>
      <span>${name} <span style="color:var(--muted);">· ${p.team || 'FA'}</span></span>
      ${dynHtml}
      ${ssnHtml}
      ${wkHtml}
    </div>`;
  }).join('');

  return `${head}<div class="fa-list">${rowsHtml || '<div class="empty">No free agents found</div>'}</div>`;
}

function renderStandings(rosters, usersById, myRosterId){
  const rows = rosters
    .slice()
    .sort((a,b) => (b.settings.wins - a.settings.wins) || ((b.settings.fpts||0) - (a.settings.fpts||0)))
    .map(r => {
      const u = usersById[r.owner_id] || {};
      const teamName = (u.metadata && u.metadata.team_name) || u.display_name || 'Unknown';
      const rec = `${r.settings.wins || 0}-${r.settings.losses || 0}${r.settings.ties ? '-'+r.settings.ties : ''}`;
      const pf = (r.settings.fpts || 0) + (r.settings.fpts_decimal ? r.settings.fpts_decimal/100 : 0);
      const rowClass = r.roster_id === myRosterId ? 'me' : '';
      return `<tr class="${rowClass}">
        <td>${teamName}</td>
        <td>${u.display_name || ''}</td>
        <td>${rec}</td>
        <td>${pf.toFixed(1)}</td>
      </tr>`;
    }).join('');

  return `<table>
    <thead><tr><th>Team</th><th>Manager</th><th>Record</th><th>Points For</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

function renderAll(){
  if(!lastData) return;
  const { myRoster, rosters, usersById, playerMap, projMap, isHalfPpr, projLabel, valuesMap, rosteredIds } = lastData;

  document.getElementById('rosterContent').innerHTML =
    `<div class="value-filters" id="valueFilters">
      <div class="value-filter ${activeFilter==='dynasty'?'active':''}" data-filter="dynasty">Dynasty Value</div>
      <div class="value-filter ${activeFilter==='season'?'active':''}" data-filter="season">Season Value</div>
      <div class="value-filter ${activeFilter==='weekly'?'active':''}" data-filter="weekly">Weekly Value</div>
    </div>` +
    renderRoster(myRoster, playerMap, valuesMap, projMap, isHalfPpr, projLabel, activeFilter);

  document.getElementById('standingsContent').innerHTML =
    renderStandings(rosters, usersById, myRoster.roster_id);

  document.getElementById('freeAgentsContent').innerHTML =
    `<div class="value-filters" id="valueFiltersFA">
      <div class="value-filter ${activeFilter==='dynasty'?'active':''}" data-filter="dynasty">Dynasty Value</div>
      <div class="value-filter ${activeFilter==='season'?'active':''}" data-filter="season">Season Value</div>
      <div class="value-filter ${activeFilter==='weekly'?'active':''}" data-filter="weekly">Weekly Value</div>
    </div>` +
    renderFreeAgents(playerMap, rosteredIds, valuesMap, projMap, isHalfPpr, projLabel, activeFilter);

  document.querySelectorAll('.value-filter').forEach(btn => {
    btn.addEventListener('click', () => {
      activeFilter = btn.dataset.filter;
      renderAll();
    });
  });
}

async function pullLatest(){
  const username = document.getElementById('usernameInput').value.trim();
  const leagueId = document.getElementById('leagueIdInput').value.trim();
  const btn = document.getElementById('fetchBtn');
  showError('');

  if(!username || !leagueId){
    showError('Enter both a username and a league ID.');
    return;
  }

  btn.disabled = true;
  try{
    setStatus('looking up user...');
    const user = await getJSON(`${API}/user/${username}`);
    if(!user || !user.user_id) throw new Error('User not found on Sleeper.');

    setStatus('loading league...');
    const league = await getJSON(`${API}/league/${leagueId}`);

    setStatus('loading rosters and managers...');
    const [rosters, usersArr, state] = await Promise.all([
      getJSON(`${API}/league/${leagueId}/rosters`),
      getJSON(`${API}/league/${leagueId}/users`),
      getJSON(`${API}/state/nfl`)
    ]);

    const usersById = {};
    usersArr.forEach(u => usersById[u.user_id] = u);

    const myRoster = rosters.find(r => r.owner_id === user.user_id);
    if(!myRoster) throw new Error('Could not find a roster owned by this username in this league.');

    const playerMap = await loadPlayersOnce();

    // display_week is Sleeper's own "current/upcoming week" field — do not add +1 to it.
    const currentWeek = state.display_week || state.week || state.leg || 1;
    const recPpr = league.scoring_settings && league.scoring_settings.rec;
    const isHalfPpr = recPpr === 0.5;
    const projLabel = `Wk ${currentWeek}`;

    const qbSlots = (league.roster_positions || []).filter(p => p === 'QB').length;
    const numQbs = qbSlots >= 2 ? 2 : 1;

    setStatus(`loading week ${currentWeek} projections + trade values...`);
    const [projMap, fcMap, dpNameMap] = await Promise.all([
      fetchProjectionsSafe(league.season, currentWeek),
      fetchFantasyCalcSafe(numQbs),
      fetchDynastyProcessSafe(numQbs)
    ]);

    const valuesMap = buildValuesMap(playerMap, fcMap, dpNameMap);

    // Header
    document.getElementById('leagueName').textContent = league.name || 'Dynasty Command Center';
    document.getElementById('leagueMeta').textContent =
      `${league.season} season · ${state.season_type} · week ${currentWeek} · ${league.total_rosters} teams`;

    const myUser = usersById[user.user_id] || {};
    const myTeamName = (myUser.metadata && myUser.metadata.team_name) || myUser.display_name || username;
    const rec = `${myRoster.settings.wins || 0}-${myRoster.settings.losses || 0}`;
    document.getElementById('teamStrip').innerHTML =
      `<span class="name">${myTeamName}</span><span class="record">${rec}</span>`;

    const rosteredIds = new Set();
    rosters.forEach(r => (r.players || []).forEach(id => rosteredIds.add(id)));

    lastData = { myRoster, rosters, usersById, playerMap, projMap, isHalfPpr, projLabel, valuesMap, rosteredIds };
    renderAll();

    try{
      await window.storage.set('last-inputs', JSON.stringify({username, leagueId}), false);
    }catch(e){ /* storage is best-effort */ }

    const warnings = [];
    if(!projMap) warnings.push('weekly projections unavailable');
    if(!fcMap) warnings.push('FantasyCalc unavailable');
    if(!dpNameMap) warnings.push('DynastyProcess unavailable');
    setStatus(`updated ${new Date().toLocaleTimeString()}${warnings.length ? ' — ' + warnings.join(', ') : ''}`);
  }catch(err){
    console.error(err);
    showError(`Couldn't load data: ${err.message}. If this keeps happening, the Sleeper API may be unreachable from here — paste roster info manually instead and I'll work with that.`);
    setStatus('load failed');
  }finally{
    btn.disabled = false;
  }
}

document.getElementById('fetchBtn').addEventListener('click', pullLatest);

(async function init(){
  try{
    const saved = await window.storage.get('last-inputs', false);
    if(saved && saved.value){
      const {username, leagueId} = JSON.parse(saved.value);
      if(username) document.getElementById('usernameInput').value = username;
      if(leagueId) document.getElementById('leagueIdInput').value = leagueId;
    }
  }catch(e){ /* no saved state yet, fine */ }
  pullLatest();
})();
</script>
